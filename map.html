<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<script>(function(){var t=localStorage.getItem('imali-theme')||'light';document.documentElement.setAttribute('data-theme',t);})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Opportunity Map — Imali.biz Internal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="styles.css">
<style>

/* ── Page layout ── */
html, body { height: 100%; overflow: hidden; }
.map-page-wrap { display: flex; flex-direction: column; height: 100vh; padding-top: var(--nav-h); }

/* ── Header strip ── */
.map-header {
  flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
  padding: 0.65rem 2rem; border-bottom: 1px solid rgba(245,240,232,0.06);
  background: rgba(10,10,15,0.72); backdrop-filter: blur(12px); gap: 1.5rem; z-index: 10;
}
[data-theme="light"] .map-header { background: rgba(250,247,242,0.92); border-bottom-color: rgba(10,10,15,0.08); }
.map-title-group { display: flex; align-items: center; gap: 1rem; flex-shrink: 0; }
.map-eyebrow { font-size: 0.6rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); font-weight: 500; margin-bottom: 0.1rem; }
[data-theme="light"] .map-eyebrow { color: #a07820; }
.map-title { font-family: 'Syne', sans-serif; font-size: 1rem; font-weight: 700; color: var(--cream); line-height: 1.15; }
[data-theme="light"] .map-title { color: var(--ink); }
.map-title em { font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; color: var(--terracotta); }
.map-live-badge { display: flex; align-items: center; gap: 0.4rem; background: rgba(212,168,50,0.07); border: 1px solid rgba(212,168,50,0.18); border-radius: 2rem; padding: 0.28rem 0.75rem; font-size: 0.67rem; color: var(--gold); white-space: nowrap; }
[data-theme="light"] .map-live-badge { color: #a07820; border-color: rgba(160,120,32,0.22); background: rgba(160,120,32,0.07); }
.live-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; animation: blink 2s ease-in-out infinite; }
.map-meta { display: flex; align-items: center; gap: 1.25rem; font-size: 0.7rem; color: rgba(245,240,232,0.3); }
[data-theme="light"] .map-meta { color: rgba(10,10,15,0.35); }
.map-meta-item { display: flex; align-items: center; gap: 0.35rem; }
.map-zoom-pill { background: rgba(245,240,232,0.04); border: 1px solid rgba(245,240,232,0.08); border-radius: 2rem; padding: 0.22rem 0.65rem; font-size: 0.67rem; color: rgba(245,240,232,0.35); min-width: 52px; text-align: center; }
[data-theme="light"] .map-zoom-pill { background: rgba(10,10,15,0.04); border-color: rgba(10,10,15,0.08); color: rgba(10,10,15,0.4); }

/* ── Leaflet map ── */
#map { flex: 1; width: 100%; min-height: 0; }
.leaflet-container { font-family: 'DM Sans', sans-serif; }
.leaflet-control-zoom { border: none !important; box-shadow: none !important; margin-top: 1rem !important; margin-right: 1rem !important; }
.leaflet-control-zoom a { font-family: 'Syne', sans-serif !important; font-weight: 700 !important; width: 34px !important; height: 34px !important; line-height: 34px !important; font-size: 1rem !important; border-radius: 10px !important; display: flex !important; align-items: center !important; justify-content: center !important; margin-bottom: 4px !important; transition: background 0.18s, color 0.18s !important; }
[data-theme="dark"]  .leaflet-control-zoom a { background: rgba(10,10,15,0.88) !important; border: 1px solid rgba(245,240,232,0.1) !important; color: rgba(245,240,232,0.6) !important; }
[data-theme="dark"]  .leaflet-control-zoom a:hover { background: rgba(200,82,26,0.18) !important; color: #ff7043 !important; border-color: rgba(200,82,26,0.3) !important; }
[data-theme="light"] .leaflet-control-zoom a { background: rgba(250,247,242,0.96) !important; border: 1px solid rgba(10,10,15,0.1) !important; color: rgba(10,10,15,0.6) !important; box-shadow: 0 2px 8px rgba(0,0,0,0.08) !important; }
[data-theme="light"] .leaflet-control-zoom a:hover { background: rgba(200,82,26,0.1) !important; color: var(--terracotta) !important; }
.leaflet-control-attribution { font-size: 0.6rem !important; border-top-left-radius: 6px !important; }
[data-theme="dark"]  .leaflet-control-attribution { background: rgba(10,10,15,0.6) !important; color: rgba(245,240,232,0.3) !important; }
[data-theme="dark"]  .leaflet-control-attribution a { color: rgba(245,240,232,0.4) !important; }
[data-theme="light"] .leaflet-control-attribution { background: rgba(250,247,242,0.82) !important; color: rgba(10,10,15,0.35) !important; }

/* Leaflet tooltips */
.leaflet-tooltip { font-family: 'DM Sans', sans-serif !important; font-size: 0.73rem !important; border-radius: 8px !important; padding: 0.3rem 0.65rem !important; box-shadow: 0 4px 16px rgba(0,0,0,0.18) !important; white-space: nowrap !important; }
.leaflet-tooltip::before { display: none !important; }
[data-theme="dark"]  .leaflet-tooltip { background: rgba(10,10,15,0.92) !important; color: rgba(245,240,232,0.82) !important; border: 1px solid rgba(245,240,232,0.1) !important; }
[data-theme="light"] .leaflet-tooltip { background: rgba(250,247,242,0.97) !important; color: rgba(10,10,15,0.78) !important; border: 1px solid rgba(10,10,15,0.09) !important; }

/* ── Coordinate pill ── */
.coord-pill { position: fixed; bottom: 1.5rem; right: 1.25rem; z-index: 150; background: rgba(10,10,15,0.78); border: 1px solid rgba(245,240,232,0.07); border-radius: 2rem; padding: 0.32rem 0.9rem; font-size: 0.67rem; color: rgba(245,240,232,0.38); backdrop-filter: blur(10px); pointer-events: none; }
[data-theme="light"] .coord-pill { background: rgba(250,247,242,0.92); border-color: rgba(10,10,15,0.09); color: rgba(10,10,15,0.4); box-shadow: 0 4px 16px rgba(0,0,0,0.07); }

/* ── Province name labels ── */
.prov-label {
  background: none !important; border: none !important;
  white-space: nowrap; pointer-events: none; user-select: none;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.8rem; font-weight: 600;
  letter-spacing: 0.22em; text-transform: uppercase;
  color: rgba(10,10,15,0.42);
  text-shadow: 1px 1px 0 rgba(255,255,255,0.9), -1px -1px 0 rgba(255,255,255,0.9),
               1px -1px 0 rgba(255,255,255,0.9), -1px 1px 0 rgba(255,255,255,0.9);
}
[data-theme="dark"] .prov-label {
  color: rgba(245,240,232,0.38);
  text-shadow: 1px 1px 0 rgba(10,10,15,0.9), -1px -1px 0 rgba(10,10,15,0.9),
               1px -1px 0 rgba(10,10,15,0.9), -1px 1px 0 rgba(10,10,15,0.9);
}

/* ══════════════════════════════════════════════════════════
   LAYER PANEL
══════════════════════════════════════════════════════════ */

.layers-panel {
  position: fixed;
  top: 130px;
  left: 14px;
  /* High z-index + translateZ forces its own GPU compositing layer,
     preventing the panel from disappearing behind Leaflet's paint layers */
  z-index: 1000;
  transform: translateZ(0);
  width: 274px;
  max-height: calc(100vh - 146px);
  display: flex;
  flex-direction: column;
  transition: width 0.22s ease;
}
.layers-panel.collapsed { width: 42px; }

.lp-card {
  background: rgba(10,10,15,0.9);
  border: 1px solid rgba(245,240,232,0.08);
  border-radius: 14px;
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  max-height: calc(100vh - 146px);
}
[data-theme="light"] .lp-card { background: rgba(250,247,242,0.97); border-color: rgba(10,10,15,0.09); box-shadow: 0 8px 32px rgba(0,0,0,0.1); }

/* Panel head */
.lp-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0.75rem 0.85rem 0.65rem;
  border-bottom: 1px solid rgba(245,240,232,0.06);
  flex-shrink: 0;
}
[data-theme="light"] .lp-head { border-bottom-color: rgba(10,10,15,0.07); }
.lp-head-left { display: flex; align-items: center; gap: 0.55rem; }
.lp-head-title { font-size: 0.62rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold); font-weight: 500; }
[data-theme="light"] .lp-head-title { color: #a07820; }
.lp-active-badge { font-size: 0.58rem; background: rgba(212,168,50,0.09); border: 1px solid rgba(212,168,50,0.18); color: var(--gold); padding: 0.1rem 0.45rem; border-radius: 1rem; }
[data-theme="light"] .lp-active-badge { color: #a07820; border-color: rgba(160,120,32,0.2); background: rgba(160,120,32,0.07); }
.lp-collapse-btn {
  background: none; border: none; color: rgba(245,240,232,0.3);
  font-size: 1rem; cursor: none; padding: 0 0.15rem;
  transition: color 0.18s; line-height: 1; flex-shrink: 0;
}
.lp-collapse-btn:hover { color: rgba(245,240,232,0.7); }
[data-theme="light"] .lp-collapse-btn { color: rgba(10,10,15,0.3); }
[data-theme="light"] .lp-collapse-btn:hover { color: rgba(10,10,15,0.65); }

/* Collapsed state */
.layers-panel.collapsed .lp-body { display: none; }
.layers-panel.collapsed .lp-head { border-bottom: none; padding: 0.75rem 0; justify-content: center; }
.layers-panel.collapsed .lp-head-left { display: none; }

/* Panel body */
.lp-body { overflow-y: auto; flex: 1; padding: 0 0 0.5rem; }
.lp-body::-webkit-scrollbar { width: 3px; }
.lp-body::-webkit-scrollbar-track { background: transparent; }
.lp-body::-webkit-scrollbar-thumb { background: rgba(245,240,232,0.1); border-radius: 2px; }
[data-theme="light"] .lp-body::-webkit-scrollbar-thumb { background: rgba(10,10,15,0.1); }

/* Search */
.lp-search-row { padding: 0.6rem 0.75rem 0.45rem; }
.lp-search-inner { display: flex; align-items: center; gap: 0.4rem; background: rgba(245,240,232,0.04); border: 1px solid rgba(245,240,232,0.08); border-radius: 8px; padding: 0.3rem 0.6rem; }
[data-theme="light"] .lp-search-inner { background: rgba(10,10,15,0.04); border-color: rgba(10,10,15,0.09); }
.lp-search-icon { font-size: 0.7rem; color: rgba(245,240,232,0.25); flex-shrink: 0; }
[data-theme="light"] .lp-search-icon { color: rgba(10,10,15,0.3); }
.lp-search-input { background: none; border: none; outline: none; font-family: 'DM Sans', sans-serif; font-size: 0.73rem; color: var(--cream); flex: 1; min-width: 0; }
[data-theme="light"] .lp-search-input { color: var(--ink); }
.lp-search-input::placeholder { color: rgba(245,240,232,0.22); }
[data-theme="light"] .lp-search-input::placeholder { color: rgba(10,10,15,0.28); }
.lp-search-clear { background: none; border: none; cursor: none; color: rgba(245,240,232,0.3); font-size: 0.85rem; padding: 0; line-height: 1; transition: color 0.15s; }
.lp-search-clear:hover { color: rgba(245,240,232,0.6); }
[data-theme="light"] .lp-search-clear { color: rgba(10,10,15,0.3); }

.lp-no-results { padding: 0.75rem 0.85rem; font-size: 0.72rem; color: rgba(245,240,232,0.3); text-align: center; }
[data-theme="light"] .lp-no-results { color: rgba(10,10,15,0.3); }

/* ── Custom checkbox ── */
.lp-check-wrap { position: relative; display: inline-flex; align-items: center; cursor: none; flex-shrink: 0; }
.lp-check-wrap input { position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none; }
.lp-check {
  display: inline-flex; align-items: center; justify-content: center;
  width: 14px; height: 14px; border-radius: 3px;
  border: 1.5px solid rgba(245,240,232,0.18);
  background: transparent; transition: background 0.15s, border-color 0.15s;
}
[data-theme="light"] .lp-check { border-color: rgba(10,10,15,0.18); }
.lp-check-wrap:hover .lp-check { border-color: rgba(200,82,26,0.5); }
.lp-check-wrap input:checked + .lp-check { background: var(--terracotta); border-color: var(--terracotta); }
.lp-check-wrap input:checked + .lp-check::after { content: ''; display: block; width: 7px; height: 3.5px; border-left: 1.5px solid #fff; border-bottom: 1.5px solid #fff; transform: rotate(-45deg) translateY(-1px); }
.lp-check-wrap input:indeterminate + .lp-check { background: rgba(200,82,26,0.16); border-color: rgba(200,82,26,0.55); }
.lp-check-wrap input:indeterminate + .lp-check::after { content: ''; display: block; width: 7px; height: 1.5px; background: var(--terracotta); border-radius: 1px; }

/* ── Groups ── */
.lp-groups { padding: 0 0 0.25rem; }

.lp-group { border-bottom: 1px solid rgba(245,240,232,0.04); }
[data-theme="light"] .lp-group { border-bottom-color: rgba(10,10,15,0.05); }
.lp-group:last-child { border-bottom: none; }

/* Group header */
.lp-group-head {
  display: flex; align-items: center; gap: 0.4rem;
  padding: 0.6rem 0.85rem 0.55rem;
  cursor: none;
}
.lp-group-head:hover { background: rgba(245,240,232,0.02); }
[data-theme="light"] .lp-group-head:hover { background: rgba(10,10,15,0.025); }

.grp-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.grp-label { font-size: 0.74rem; font-weight: 500; color: var(--cream); flex: 1; }
[data-theme="light"] .grp-label { color: var(--ink); }
.grp-count { font-size: 0.6rem; color: rgba(245,240,232,0.3); margin-left: auto; white-space: nowrap; }
[data-theme="light"] .grp-count { color: rgba(10,10,15,0.35); }
.grp-count.has-active { color: var(--terracotta); }

/* Chevron */
.lp-chevron { background: none; border: none; padding: 0; cursor: none; color: rgba(245,240,232,0.25); display: flex; align-items: center; justify-content: center; width: 16px; height: 16px; flex-shrink: 0; transition: transform 0.2s, color 0.15s; }
.lp-chevron svg { width: 9px; height: 9px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.lp-chevron.open { transform: rotate(90deg); color: rgba(245,240,232,0.5); }
[data-theme="light"] .lp-chevron { color: rgba(10,10,15,0.25); }
[data-theme="light"] .lp-chevron.open { color: rgba(10,10,15,0.5); }
.lp-chevron-spacer { width: 16px; flex-shrink: 0; }

/* Group body */
.lp-group-body { display: none; }
.lp-group-body.open { display: block; }

/* ── Layer item ── */
.lp-layer {
  padding: 0 0.75rem 0 0.85rem;
  border-bottom: 1px solid rgba(245,240,232,0.03);
  transition: background 0.15s;
}
[data-theme="light"] .lp-layer { border-bottom-color: rgba(10,10,15,0.04); }
.lp-layer:last-child { border-bottom: none; }
.lp-layer.drag-over { background: rgba(200,82,26,0.07); border-radius: 6px; }
.lp-layer.dragging { opacity: 0.4; }

.lp-layer-row {
  display: flex; align-items: center; gap: 0.4rem;
  padding: 0.5rem 0 0.25rem;
  min-height: 36px;
}

.drag-handle { color: rgba(245,240,232,0.15); cursor: grab; flex-shrink: 0; display: flex; align-items: center; font-size: 0.75rem; user-select: none; transition: color 0.15s; }
.drag-handle:hover { color: rgba(245,240,232,0.4); }
.drag-handle:active { cursor: grabbing; }
[data-theme="light"] .drag-handle { color: rgba(10,10,15,0.15); }
[data-theme="light"] .drag-handle:hover { color: rgba(10,10,15,0.4); }

.lyr-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; opacity: 0.9; }
.lp-layer-text { flex: 1; min-width: 0; }
.lyr-name { display: block; font-size: 0.73rem; color: rgba(245,240,232,0.75); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color 0.15s; }
[data-theme="light"] .lyr-name { color: rgba(10,10,15,0.72); }
.lp-layer input:checked ~ .lp-layer-text .lyr-name,
.lyr-name.active { color: var(--cream); }
[data-theme="light"] .lyr-name.active { color: var(--ink); }
.lyr-desc { display: block; font-size: 0.62rem; color: rgba(245,240,232,0.28); margin-top: 0.08rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color 0.15s; }
[data-theme="light"] .lyr-desc { color: rgba(10,10,15,0.32); }
/* Hover — let the full description wrap into view */
.lp-layer-text:hover .lyr-desc { white-space: normal; overflow: visible; text-overflow: clip; color: rgba(245,240,232,0.58); }
[data-theme="light"] .lp-layer-text:hover .lyr-desc { color: rgba(10,10,15,0.56); }

/* Solo / eye button */
.lp-eye-btn {
  background: none; border: none; cursor: none; padding: 0;
  color: rgba(245,240,232,0.2); display: flex; align-items: center;
  width: 20px; height: 20px; justify-content: center;
  border-radius: 4px; flex-shrink: 0; transition: color 0.15s, background 0.15s;
}
.lp-eye-btn svg { width: 13px; height: 13px; fill: currentColor; }
.lp-eye-btn:hover { color: rgba(245,240,232,0.6); background: rgba(245,240,232,0.06); }
.lp-eye-btn.soloed { color: var(--gold); background: rgba(212,168,50,0.12); }
[data-theme="light"] .lp-eye-btn { color: rgba(10,10,15,0.22); }
[data-theme="light"] .lp-eye-btn:hover { color: rgba(10,10,15,0.55); background: rgba(10,10,15,0.05); }
[data-theme="light"] .lp-eye-btn.soloed { color: #a07820; background: rgba(160,120,32,0.1); }

/* Opacity slider row */
.lp-opacity-row { display: flex; align-items: center; gap: 0.5rem; padding: 0 0 0.5rem 1.45rem; }
.lp-slider {
  -webkit-appearance: none; appearance: none;
  flex: 1; height: 3px; border-radius: 2px; outline: none; cursor: pointer;
  background: linear-gradient(to right, var(--terracotta) 80%, rgba(245,240,232,0.12) 80%);
}
.lp-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 11px; height: 11px; border-radius: 50%; background: var(--cream); border: 2px solid var(--terracotta); cursor: pointer; transition: transform 0.12s; }
.lp-slider::-webkit-slider-thumb:hover { transform: scale(1.25); }
[data-theme="light"] .lp-slider::-webkit-slider-thumb { background: white; }
.lp-opacity-val { font-size: 0.6rem; color: rgba(245,240,232,0.3); width: 26px; text-align: right; flex-shrink: 0; }
[data-theme="light"] .lp-opacity-val { color: rgba(10,10,15,0.35); }

/* Child layers (nested under Construction Intelligence) */
.lp-children { display: none; border-left: 1px solid rgba(245,240,232,0.06); margin-left: 1.45rem; padding-left: 0.5rem; margin-bottom: 0.25rem; }
[data-theme="light"] .lp-children { border-left-color: rgba(10,10,15,0.07); }
.lp-children.open { display: block; }
.lp-child .drag-handle { display: none; }
.lp-child .lp-layer-row { padding-top: 0.4rem; }
.lp-child .lp-opacity-row { padding-left: 1.1rem; }

/* Grandchild layers (3rd level — district under province under proposed_zoning) */
.lp-grandchild .drag-handle { display: none; }
.lp-grandchild .lp-layer-row { padding-top: 0.32rem; min-height: 30px; }
.lp-grandchild .lp-opacity-row { padding-left: 0.6rem; }
.lp-grandchild .lyr-name { font-size: 0.69rem; }
.lp-grandchild .lyr-desc { font-size: 0.6rem; }

/* ══════════════════════════════════════════════════════════════
   ACTIVE LEGEND PANEL
══════════════════════════════════════════════════════════════ */
.lp-legend-section {
  border-top: 1px solid rgba(245,240,232,0.07);
  margin-top: 0.15rem;
}
[data-theme="light"] .lp-legend-section { border-top-color: rgba(10,10,15,0.07); }

.lp-legend-head {
  display: flex; align-items: center; gap: 0.4rem;
  padding: 0.55rem 0.85rem 0.45rem;
}
.lp-legend-label { font-size: 0.62rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold); font-weight: 500; }
[data-theme="light"] .lp-legend-label { color: #a07820; }
.lp-legend-src { font-size: 0.57rem; color: rgba(245,240,232,0.25); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
[data-theme="light"] .lp-legend-src { color: rgba(10,10,15,0.28); }

.lp-legend-body { display: none; }
.lp-legend-body.open { display: block; padding: 0 0.7rem 0.6rem 0.85rem; }

.lp-legend-group { margin-bottom: 0.8rem; }
.lp-legend-group:last-child { margin-bottom: 0; }

.lp-legend-grp-name {
  font-size: 0.63rem; font-weight: 500;
  color: rgba(245,240,232,0.5); margin-bottom: 0.28rem;
  padding-bottom: 0.18rem;
  border-bottom: 1px solid rgba(245,240,232,0.05);
}
[data-theme="light"] .lp-legend-grp-name { color: rgba(10,10,15,0.5); border-bottom-color: rgba(10,10,15,0.06); }

.lp-legend-item {
  display: flex; align-items: center; gap: 0.45rem;
  padding: 0.12rem 0;
}
.lp-legend-swatch {
  width: 18px; height: 18px; flex-shrink: 0; display: block;
  border-radius: 2px; image-rendering: pixelated;
}
.lp-legend-lbl {
  font-size: 0.63rem; color: rgba(245,240,232,0.62); line-height: 1.35;
}
[data-theme="light"] .lp-legend-lbl { color: rgba(10,10,15,0.62); }

.lp-legend-msg {
  font-size: 0.67rem; color: rgba(245,240,232,0.28); padding: 0.35rem 0;
  text-align: center;
}
[data-theme="light"] .lp-legend-msg { color: rgba(10,10,15,0.3); }

<script>
'use strict';

// ── Cursor ────────────────────────────────────────────────────────────────────
const cursor = document.getElementById('cursor');
const ring   = document.getElementById('cursorRing');
let mx=0,my=0,rx=0,ry=0;
document.addEventListener('mousemove', e => { mx=e.clientX; my=e.clientY; cursor.style.transform=`translate(${mx-5}px,${my-5}px)`; });
(function ar(){rx+=(mx-rx-18)*.12;ry+=(my-ry-18)*.12;ring.style.transform=`translate(${rx}px,${ry}px)`;requestAnimationFrame(ar);})();

// ── Tiles ─────────────────────────────────────────────────────────────────────
const TILES = {
  light: L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
    { attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>', subdomains:'abcd', maxZoom:20 }),
  dark:  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
    { attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>', subdomains:'abcd', maxZoom:20 })
};

// ── Kigali City Master Plan server (ArcGIS REST) ──────────────────────────────
const MP_URL   = 'https://masterplan.kigalicity.gov.rw/server/rest/services/Masterplan2020/Masterplan2020_24June2024/MapServer';
const NSDI_MP  = 'https://geodata.rw/server/rest/services/masterplan'; // district DLUPs + national plan

// ── Zoning colour palette (applied to all FeatureServer DLUP layers) ──────────
// Follows standard urban-planning conventions so colours read consistently
// across the national plan and every district DLUP.
function zoningColor(zoning) {
  const c = (zoning || '').toUpperCase().trim();
  if (c.startsWith('R1'))                      return '#fff9c4'; // Low-density residential — pale yellow
  if (c.startsWith('R2'))                      return '#fff176'; // Medium-density residential
  if (c.startsWith('R3'))                      return '#ffee58'; // High-density residential
  if (c.startsWith('R4') || c.startsWith('R5'))return '#fdd835'; // Very high / mixed residential
  if (c.startsWith('R'))                       return '#fffde7'; // Other residential
  if (c.startsWith('C1'))                      return '#ffe0b2'; // Local commercial centre
  if (c.startsWith('C2'))                      return '#ffcc80'; // District commercial centre
  if (c.startsWith('C3') || c.startsWith('C4'))return '#ffa726'; // Town / city centre
  if (c.startsWith('C'))                       return '#fff3e0'; // Other commercial
  if (c.startsWith('MU') || c.startsWith('M1') || c.startsWith('M2')) return '#ce93d8'; // Mixed use — purple
  if (c.startsWith('I1') || c.startsWith('IN'))return '#b0bec5'; // Industrial — steel blue-grey
  if (c.startsWith('I'))                       return '#cfd8dc'; // Other industrial
  if (c.startsWith('A1'))                      return '#c8e6c9'; // Agriculture (prime)
  if (c.startsWith('A2'))                      return '#a5d6a7'; // Agriculture (secondary)
  if (c.startsWith('A'))                       return '#81c784'; // Other agricultural
  if (c.startsWith('OS') || c.startsWith('GR'))return '#dcedc8'; // Open space / green
  if (c.startsWith('PF') || c.startsWith('P1') || c.startsWith('P2')) return '#d1c4e9'; // Public facility
  if (c.startsWith('ED') || c.startsWith('E1'))return '#e1bee7'; // Education
  if (c.startsWith('T') && !c.startsWith('TR'))return '#b2ebf2'; // Tourism
  if (c.startsWith('TR') || c.startsWith('RD'))return '#eceff1'; // Transport / roads
  if (c.startsWith('W') || c.startsWith('WL')) return '#81d4fa'; // Water / wetland
  if (c.startsWith('NR') || c.startsWith('BU'))return '#dce775'; // Nature / buffer
  return '#e0e0e0';                                              // Unknown / unclassified
}

// Factory: per-district DLUP using the district's own MapServer service.
// Each district has its own MapServer at geodata.rw — server renders GIS styling
// (matching the colours you see on the actual NSDI GIS website), visible at all
// zoom levels, and no layerDefs filter so tile caching stays active → fast load.
function mkDistrictZoning(mapServerUrl) {
  return L.esri.dynamicMapLayer({
    url: mapServerUrl,
    opacity: 0.8,
    f: 'image', format: 'png8', transparent: true
  });
}

// ── Provincial-data URL bases ───────────────────────────────────────────────
// National topographic admin boundaries (province + district lines, all Rwanda)
const ADM_URL  = 'https://geodata.rw/server/rest/services/TopographicMap_Administrative_Boundaries_1k/MapServer';
// Land use / land cover 2017–2022, village polygons with province field
const LULC_URL = 'https://geodata.rw/server/rest/services/land_use_land_cover_20172022/MapServer';

// Factory: NLUDMP2050 MapServer — server-rendered GIS styling, no per-province
// filter. layerDefs filtering disables the server's tile cache and forces a
// full re-render on every request, which is why filtered layers are slow.
// Without filtering the server uses cached tiles → same speed as Kigali layer.
// png8 format cuts image size ~70% vs png32 with no visible quality difference.
// The user navigates the map to the province of interest; the zoom handles it.
function mkProvZoning() {
  return L.esri.dynamicMapLayer({
    url: `${NSDI_MP}/NLUDMP2050_FS/MapServer`,
    opacity: 0.8,
    f: 'image', format: 'png8', transparent: true
  });
}

// Factory: national admin boundaries filtered to a province via layerDefs
// Shows province boundary area + district area polygons from topographic map
function mkProvAdmin(prov) {
  return L.esri.dynamicMapLayer({
    url: ADM_URL,
    layers: [6, 7, 14, 15],
    layerDefs: { '14': `pareaname = '${prov}'`, '15': `pareaname = '${prov}'` },
    opacity: 0.8,
    f: 'image', format: 'png32', transparent: true
  });
}

// Factory: topographic land use map — vegetation, cultivation, open space, water.
// The LULC village-boundary dataset has no land-use classification fields so we
// use the national topographic land use map instead. Province filtering is not
// available on this MapServer; zoom into the province of interest to see detail.
function mkProvLULC(districts) {
  return L.esri.dynamicMapLayer({
    url: 'https://geodata.rw/server/rest/services/TopographicMap_Land_use_1k/MapServer',
    layers: [88],
    opacity: 0.7,
    f: 'image', format: 'png32', transparent: true
  });
}

// Maps each internal layer id → the ArcGIS sub-layer ids it renders.
// Used to pull the right legend entries when that layer is active.
const MP_LAYERS_MAP = {
  kigali_zoning:    [117],
  kigali_landuse:   [116],
  kigali_admin:     [4, 5],
  planning_overlays:[82, 88, 89, 91, 92, 94, 95, 96],
};

// Identify URLs for district DLUP MapServer layers (queried on hover alongside MP_URL)
const DLUP_IDENTIFY = {
  burera_dlup:    `${NSDI_MP}/Burera_DLUP/MapServer`,
  gakenke_dlup:   `${NSDI_MP}/Gakenke_DLUP/MapServer`,
  gicumbi_dlup:   `${NSDI_MP}/Gicumbi_DLUP/MapServer`,
  musanze_dlup:   `${NSDI_MP}/Musanze_DLUP/MapServer`,
  rulindo_dlup:   `${NSDI_MP}/Rulindo_DLUP/MapServer`,
  gisagara_dlup:  `${NSDI_MP}/Gisagara_DLUP/MapServer`,
  huye_dlup:      `${NSDI_MP}/Huye_DLUP/MapServer`,
  muhanga_dlup:   `${NSDI_MP}/Muhanga_DLUP/MapServer`,
  nyamagabe_dlup: `${NSDI_MP}/Nyamagabe_DLUP/MapServer`,
  nyanza_dlup:    `${NSDI_MP}/Nyanza_DLUP/MapServer`,
  nyaruguru_dlup: `${NSDI_MP}/Nyaruguru_DLUP/MapServer`,
  ruhango_dlup:   `${NSDI_MP}/Ruhango_DLUP/MapServer`,
  bugesera_dlup:  `${NSDI_MP}/Bugesera_DLUP/MapServer`,
  gatsibo_dlup:   `${NSDI_MP}/Gatsibo_DLUP/MapServer`,
  kayonza_dlup:   `${NSDI_MP}/Kayonza_DLUP/MapServer`,
  kirehe_dlup:    `${NSDI_MP}/Kirehe_DLUP/MapServer`,
  ngoma_dlup:     `${NSDI_MP}/Ngoma_DLUP/MapServer`,
  nyagatare_dlup: `${NSDI_MP}/Nyagatare_DLUP/MapServer`,
  rwamagana_dlup: `${NSDI_MP}/Rwamagana_DLUP/MapServer`,
  karongi_dlup:   `${NSDI_MP}/Karongi_DLUP/MapServer`,
  ngororero_dlup: `${NSDI_MP}/Ngororero_DLUP/MapServer`,
  nyabihu_dlup:   `${NSDI_MP}/Nyabihu_DLUP/MapServer`,
  nyamasheke_dlup:`${NSDI_MP}/Nyamasheke_DLUP/MapServer`,
  rubavu_dlup:    `${NSDI_MP}/Rubavu_DLUP/MapServer`,
  rutsiro_dlup:   `${NSDI_MP}/Rutsiro_DLUP/MapServer`,
  rusizi_dlup:    `${NSDI_MP}/Rusizi_DLUP/MapServer`,
};

// Kigali City master plan legend cache
let _mpLegend = null;

async function getMPLegend() {
  if (_mpLegend !== null) return _mpLegend;
  _mpLegend = {};
  try {
    const r = await fetch(`${MP_URL}/legend?f=json`);
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    for (const lyr of (data.layers || [])) {
      _mpLegend[lyr.layerId] = { name: lyr.layerName, items: lyr.legend || [] };
    }
  } catch(e) {
    console.warn('Could not fetch Master Plan legend:', e);
  }
  return _mpLegend;
}

// Per-district DLUP legend cache: { mapServerUrl → { layerId → { name, items } } }
// Fetched lazily on first identify hover over a DLUP layer — independent of the
// AbortController so the cache survives identify cancellations.
const _dlupLegends = {};
async function getDLUPLegend(url) {
  if (_dlupLegends[url] != null) return _dlupLegends[url];
  _dlupLegends[url] = {};
  try {
    const r = await fetch(`${url}/legend?f=json`);
    if (r.ok) {
      const d = await r.json();
      for (const l of (d.layers || [])) {
        _dlupLegends[url][l.layerId] = { name: l.layerName, items: l.legend || [] };
      }
    }
  } catch(e) { /* silently ignore — tooltip will just show the raw zone code */ }
  return _dlupLegends[url];
}

async function updateLegendPanel() {
  const section = document.getElementById('lpLegendSection');
  const body    = document.getElementById('lpLegendBody');
  if (!section || !body) return;

  // Which MP layers are currently visible?
  const active = Object.entries(MP_LAYERS_MAP).filter(([id]) => {
    const f = findLayer(id); return f && f.layer.visible;
  });

  if (active.length === 0) { section.style.display = 'none'; return; }

  section.style.display = '';
  body.innerHTML = '<div class="lp-legend-msg">Loading legend…</div>';

  const legend = await getMPLegend();
  if (!legend || Object.keys(legend).length === 0) {
    body.innerHTML = '<div class="lp-legend-msg">Legend data unavailable</div>';
    return;
  }

  let html = '';
  for (const [, arcIds] of active) {
    for (const arcId of arcIds) {
      const lyr = legend[arcId]; if (!lyr) continue;
      const validItems = lyr.items.filter(it => it.imageData);
      if (!validItems.length) continue;
      html += `<div class="lp-legend-group">`;
      html += `<div class="lp-legend-grp-name">${lyr.name}</div>`;
      for (const it of validItems) {
        const ct = it.contentType || 'image/png';
        html += `<div class="lp-legend-item">
          <img class="lp-legend-swatch" src="data:${ct};base64,${it.imageData}" alt="">
          <span class="lp-legend-lbl">${it.label || '—'}</span>
        </div>`;
      }
      html += `</div>`;
    }
  }

  body.innerHTML = html || '<div class="lp-legend-msg">No legend entries for active layers</div>';
}

// ── Map init ──────────────────────────────────────────────────────────────────
const initialTheme = document.documentElement.getAttribute('data-theme') || 'light';
const RWANDA_BOUNDS = L.latLngBounds(L.latLng(-2.84,28.86), L.latLng(-1.05,30.90));

const map = L.map('map', {
  center:[-1.9403,29.8739], zoom:8, zoomControl:false, attributionControl:true,
  layers:[TILES[initialTheme]],
  maxBounds:RWANDA_BOUNDS, maxBoundsViscosity:1.0, minZoom:8, maxZoom:20
});
L.control.zoom({ position:'topright' }).addTo(map);
map.fitBounds(RWANDA_BOUNDS, { padding:[52,52] });

// Custom pane for border — always on top of data layers
map.createPane('borderPane');
map.getPane('borderPane').style.zIndex = 450;

// ── Rwanda border ─────────────────────────────────────────────────────────────
const BORDER_STYLE = {
  dark:  { glow:{color:'#d4a832',weight:8, opacity:0.18}, line:{color:'#d4a832',weight:2.5,opacity:0.9}  },
  light: { glow:{color:'#c8521a',weight:8, opacity:0.15}, line:{color:'#c8521a',weight:2.5,opacity:0.85} }
};
let borderGlow=null, borderLine=null;

function applyBorderStyle(theme) {
  if (!borderGlow||!borderLine) return;
  const s=BORDER_STYLE[theme];
  borderGlow.setStyle({color:s.glow.color,weight:s.glow.weight,opacity:s.glow.opacity,fillOpacity:0});
  borderLine.setStyle({color:s.line.color,weight:s.line.weight,opacity:s.line.opacity,fillOpacity:0});
}
function drawBorder(geo) {
  const s=BORDER_STYLE[document.documentElement.getAttribute('data-theme')||'light'];
  borderGlow=L.geoJSON(geo,{pane:'borderPane',style:{color:s.glow.color,weight:s.glow.weight,opacity:s.glow.opacity,fill:false}}).addTo(map);
  borderLine=L.geoJSON(geo,{pane:'borderPane',style:{color:s.line.color,weight:s.line.weight,opacity:s.line.opacity,fill:false}}).addTo(map);
}
fetch('https://raw.githubusercontent.com/wmgeolab/geoBoundaries/main/releaseData/gbOpen/RWA/ADM0/geoBoundaries-RWA-ADM0.geojson')
  .then(r=>{ if(!r.ok) throw 0; return r.json(); }).then(drawBorder)
  .catch(()=>fetch('https://nominatim.openstreetmap.org/search?q=Rwanda&polygon_geojson=1&format=geojson&limit=1')
    .then(r=>r.json()).then(drawBorder).catch(()=>{}));

// ── Province name labels (matching basemap "KIGALI" style) ───────────────────
// Permanent divIcon markers placed over each province's geographic centre.
// iconSize width must be wide enough for the text — iconAnchor centres it.
(function addProvinceLabels() {
  const provinces = [
    { name:'NORTHERN',  ll:[-1.45, 29.82] },
    { name:'SOUTHERN',  ll:[-2.48, 29.65] },
    { name:'EASTERN',   ll:[-1.75, 30.72] },
    { name:'WESTERN',   ll:[-2.10, 29.08] },
  ];
  provinces.forEach(p => {
    L.marker(p.ll, {
      icon: L.divIcon({
        className: 'prov-label',
        html: p.name,
        iconSize:   [160, 20],
        iconAnchor: [80, 10],
      }),
      interactive: false,
      zIndexOffset: -1000,
    }).addTo(map);
  });
})();

// ════════════════════════════════════════════════════════════════════════════
// LAYER SYSTEM
// ════════════════════════════════════════════════════════════════════════════

// ── Demo geo-data ─────────────────────────────────────────────────────────────

function mkCircle(ll, color, r, tooltip) {
  return L.circleMarker(ll, { radius:r, fillColor:color, color:'#fff', weight:1.5, opacity:1, fillOpacity:0.85 })
          .bindTooltip(tooltip, { sticky:false, direction:'top', offset:[0,-6] });
}

      if (d >= 800)  return '#e53935';
      if (d >= 400)  return '#f44336';
      if (d >= 300)  return '#ff7043';
      if (d >= 200)  return '#ff9800';
      if (d >= 100)  return '#ffc107';
      return '#66bb6a';

      const r = Math.max(8, Math.min(28, Math.sqrt(d.density) * 0.5));

// ── Layer lookup helpers ──────────────────────────────────────────────────────
function allLeafLayers(grp) {
  const out=[];
  function collect(layer) {
    if (layer.children && layer.children.length>0) layer.children.forEach(collect);
    else out.push(layer);
  }
  grp.layers.forEach(collect);
  return out;
}
function findLayer(id) {
  for (const g of LAYER_GROUPS) {
    for (const l of g.layers) {
      if (l.id===id) return {layer:l, group:g};
      if (l.children) {
        for (const c of l.children) {
          if (c.id===id) return {layer:c, group:g, parent:l};
          if (c.children) {
            const gc=c.children.find(x=>x.id===id);
            if (gc) return {layer:gc, group:g, parent:c, grandparent:l};
          }
        }
      }
    }
  }
  return null;
}

// Find any layer node by id searching the full tree (used by syncParentCb)
function findNode(id) {
  function search(layers) {
    for (const l of layers) {
      if (l.id===id) return l;
      if (l.children) { const f=search(l.children); if(f) return f; }
    }
    return null;
  }
  for (const g of LAYER_GROUPS) { const f=search(g.layers); if(f) return f; }
  return null;
}

// Collect all leaf layers under a node (recursive)
function collectLeaves(layer) {
  if (!layer.children || layer.children.length===0) return [layer];
  return layer.children.flatMap(collectLeaves);
}

// ── Leaflet layer management ──────────────────────────────────────────────────
function ensureBuilt(layer) {
  if (!layer.leaflet && BUILDERS[layer.id]) {
    layer.leaflet = BUILDERS[layer.id]();
  }
}
function setVisible(layer, vis) {
  layer.visible = vis;
  ensureBuilt(layer);
  if (layer.leaflet) {
    if (vis) map.addLayer(layer.leaflet);
    else     map.removeLayer(layer.leaflet);
  }
}
function setOpacity(layer, pct) {
  layer.opacity = pct;
  if (!layer.leaflet) return;
  const op = pct / 100;
  if (layer.leaflet.eachLayer) {
    // L.layerGroup — iterate sub-layers
    layer.leaflet.eachLayer(l => {
      if (l.setStyle) l.setStyle({ opacity:op, fillOpacity: op * 0.85 });
      if (l.setOpacity) l.setOpacity(op);
    });
  } else if (layer.leaflet.setOpacity) {
    // L.esri.dynamicMapLayer and other single-layer types
    layer.leaflet.setOpacity(op);
  } else if (layer.leaflet.setStyle) {
    // L.esri.featureLayer — update polygon stroke + fill opacity
    layer.leaflet.setStyle({ opacity: op * 0.5, fillOpacity: op * 0.65 });
  }
}

// ── Active count ──────────────────────────────────────────────────────────────
function updateActiveCounts() {
  let total=0;
  LAYER_GROUPS.forEach(g => {
    const leaves=allLeafLayers(g);
    const n=leaves.filter(l=>l.visible).length;
    total+=n;
    const el=document.getElementById(`gc-count-${g.id}`);
    if(el){ el.textContent=`${n}/${leaves.length}`; el.className='grp-count'+(n>0?' has-active':''); }
  });
  document.getElementById('activeCount').textContent=`${total} active`;
  document.getElementById('headerLayerCount').textContent=`${total} layer${total!==1?'s':''} active`;
  updateLegendPanel();
}

// ── Group checkbox state (checked / indeterminate / unchecked) ────────────────
function syncGroupCb(grpId) {
  const grp=LAYER_GROUPS.find(g=>g.id===grpId); if(!grp) return;
  const leaves=allLeafLayers(grp);
  const n=leaves.filter(l=>l.visible).length;
  const cb=document.getElementById(`gcb-${grpId}`); if(!cb) return;
  if(n===0){ cb.checked=false; cb.indeterminate=false; }
  else if(n===leaves.length){ cb.checked=true; cb.indeterminate=false; }
  else{ cb.checked=false; cb.indeterminate=true; }
}
function syncParentCb(parentId) {
  const node=findNode(parentId); if(!node||!node.children) return;
  const leaves=collectLeaves(node);
  const n=leaves.filter(l=>l.visible).length;
  const cb=document.getElementById(`lcb-${parentId}`); if(!cb) return;
  if(n===0){ cb.checked=false; cb.indeterminate=false; }
  else if(n===leaves.length){ cb.checked=true; cb.indeterminate=false; }
  else{ cb.checked=false; cb.indeterminate=true; }
}
// Sync ALL parent container checkboxes in a group (walks the full tree)
function syncAllParentCbs(grp) {
  function syncNode(layers) {
    layers.forEach(l => {
      if (l.children) { syncNode(l.children); syncParentCb(l.id); }
    });
  }
  syncNode(grp.layers);
}

// ── Solo mode ─────────────────────────────────────────────────────────────────
let soloedId=null;
function applySolo(id) {
  const wasThisOne=(soloedId===id);
  soloedId=wasThisOne?null:id;
  // Show/hide all leaf layers based on solo state
  LAYER_GROUPS.forEach(g=>{
    allLeafLayers(g).forEach(l=>{
      if(!l.leaflet) return;
      if(soloedId===null) {
        // restore visibility to data model
        if(l.visible) map.addLayer(l.leaflet); else map.removeLayer(l.leaflet);
      } else {
        if(l.id===soloedId) map.addLayer(l.leaflet);
        else                map.removeLayer(l.leaflet);
      }
    });
  });
  // Update eye button appearances
  document.querySelectorAll('.lp-eye-btn').forEach(btn=>{
    btn.classList.toggle('soloed', btn.dataset.layer===soloedId);
  });
}

    </div>
    ${hasCh ? `<div class="lp-children${lyr.expanded?' open':''}" id="lchildren-${lyr.id}">
      ${lyr.children.map(c=>renderLayer(c,grpId,depth+1)).join('')}

function renderGroup(grp) {
  const leaves=allLeafLayers(grp);
  return `

function renderPanel() {

// EVENT LISTENERS
// ══════════════════════════════════════════════════════════════════════════════

function attachPanelListeners() {

  // ── Chevrons (accordion) ──
  document.querySelectorAll('.lp-chevron[data-target]').forEach(btn => {
    btn.addEventListener('click', () => {
      const target = document.getElementById(btn.dataset.target);
      if (!target) return;
      const open = target.classList.toggle('open');
      btn.classList.toggle('open', open);
      // sync data model
      if (btn.id.startsWith('gch-')) {
        const g=LAYER_GROUPS.find(g=>btn.id===`gch-${g.id}`); if(g) g.expanded=open;
      } else if (btn.id.startsWith('lch-')) {
        const id=btn.id.replace('lch-','');
        const node=findNode(id); if(node) node.expanded=open;
      }
    });
  });

  // ── Group checkbox ──
  document.querySelectorAll('input[data-isgrp]').forEach(cb => {
    cb.addEventListener('change', () => {
      const grp=LAYER_GROUPS.find(g=>g.id===cb.dataset.grp); if(!grp) return;
      allLeafLayers(grp).forEach(l => {
        l.visible=cb.checked;
        setVisible(l, cb.checked);
        const lc=document.getElementById(`lcb-${l.id}`); if(lc){ lc.checked=cb.checked; lc.indeterminate=false; }
      });
      // sync all container checkboxes at every depth
      syncAllParentCbs(grp);
      syncGroupCb(grp.id);
      updateActiveCounts();
    });
  });

  // ── Layer checkbox ──
  document.querySelectorAll('input[type="checkbox"][data-layer]').forEach(cb => {
    cb.addEventListener('change', () => {
      const id=cb.dataset.layer;
      const found=findLayer(id); if(!found) return;
      const {layer, group, parent}=found;

      if (layer.children) {
        // Parent-of-children: cascade toggle through all depths
        const cascadeToggle = (children, vis) => {
          children.forEach(c => {
            if (c.children) {
              // intermediate container — update its checkbox + recurse
              const lc=document.getElementById(`lcb-${c.id}`);
              if(lc){ lc.checked=vis; lc.indeterminate=false; }
              cascadeToggle(c.children, vis);
            } else {
              c.visible=vis;
              setVisible(c, vis);
              const lc=document.getElementById(`lcb-${c.id}`);
              if(lc){ lc.checked=vis; lc.indeterminate=false; }
            }
          });
        };
        cascadeToggle(layer.children, cb.checked);
      } else {
        setVisible(layer, cb.checked);
      }

      // Sync all ancestor checkboxes (parent, grandparent)
      if (parent)      syncParentCb(parent.id);
      if (found.grandparent) syncParentCb(found.grandparent.id);
      syncGroupCb(group.id);
      updateActiveCounts();
    });
  });

  // ── Opacity sliders ──
  document.querySelectorAll('.lp-slider').forEach(slider => {
    const update = () => {
      const pct=+slider.value;
      slider.style.background=`linear-gradient(to right,var(--terracotta) ${pct}%,rgba(245,240,232,0.12) ${pct}%)`;
      const valEl=document.getElementById(`opv-${slider.dataset.layer}`); if(valEl) valEl.textContent=`${pct}%`;
      const found=findLayer(slider.dataset.layer); if(found) setOpacity(found.layer, pct);
    };
    slider.addEventListener('input', update);
  });

  // ── Solo (eye) buttons ──
  document.querySelectorAll('.lp-eye-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const id=btn.dataset.layer;
      const found=findLayer(id); if(!found) return;
      // Ensure the layer is built & added before soloing
      ensureBuilt(found.layer);
      if (!found.layer.visible && !found.layer.leaflet) return;
      if (!found.layer.visible) { found.layer.visible=true; setVisible(found.layer,true); }
      applySolo(id);
    });
  });

  // ── Search ──
  const searchInput=document.getElementById('layerSearch');
  const searchClear=document.getElementById('searchClear');
  const noResults=document.getElementById('lpNoResults');

  searchInput.addEventListener('input', () => {
    const q=searchInput.value.trim().toLowerCase();
    searchClear.style.display=q?'block':'none';
    let anyVisible=false;
    document.querySelectorAll('.lp-layer').forEach(el=>{
      const name=el.querySelector('.lyr-name')?.textContent.toLowerCase()||'';
      const desc=el.querySelector('.lyr-desc')?.textContent.toLowerCase()||'';
      const match=!q||name.includes(q)||desc.includes(q);
      el.style.display=match?'':'none';
      if(match) anyVisible=true;
    });
    // Show group headers if any child visible
    document.querySelectorAll('.lp-group').forEach(grpEl=>{
      const visible=[...grpEl.querySelectorAll('.lp-layer')].some(l=>l.style.display!=='none');
      grpEl.style.display=visible?'':'none';
      // Auto-expand groups during search
      if (q && visible) {
        grpEl.querySelector('.lp-group-body')?.classList.add('open');
        grpEl.querySelector('.lp-chevron[data-target]')?.classList.add('open');
      }
    });
    noResults.style.display=(!anyVisible&&q)?'block':'none';
  });
  searchClear.addEventListener('click', () => {
    searchInput.value=''; searchClear.style.display='none'; noResults.style.display='none';
    document.querySelectorAll('.lp-layer,.lp-group').forEach(el=>el.style.display='');
  });

  // ── Drag to reorder ───────────────────────────────────────────────────────
  let dragSrc=null;
  document.querySelectorAll('.lp-layer:not(.lp-child)').forEach(el=>attachDrag(el));

  function attachDrag(el) {
    el.addEventListener('dragstart', e => {
      dragSrc=el; el.classList.add('dragging');
      e.dataTransfer.effectAllowed='move';
    });
    el.addEventListener('dragend', () => {
      dragSrc=null; el.classList.remove('dragging');
      document.querySelectorAll('.lp-layer').forEach(l=>l.classList.remove('drag-over'));
      reorderLeafletLayers();
    });
    el.addEventListener('dragover', e => {
      e.preventDefault(); e.dataTransfer.dropEffect='move';
      if (dragSrc&&dragSrc!==el&&el.parentNode===dragSrc.parentNode) {
        document.querySelectorAll('.lp-layer').forEach(l=>l.classList.remove('drag-over'));
        el.classList.add('drag-over');
        const body=el.parentNode;
        const all=[...body.querySelectorAll(':scope>.lp-layer:not(.lp-child)')];
        const idx=all.indexOf(el);
        const srcIdx=all.indexOf(dragSrc);
        if(srcIdx<idx) body.insertBefore(dragSrc, el.nextSibling);
        else body.insertBefore(dragSrc, el);
      }
    });
    el.addEventListener('drop', e=>e.preventDefault());
  }

  function reorderLeafletLayers() {
    // Bring visible layers to front in DOM order (bottom of list = on top of map)
    document.querySelectorAll('.lp-group-body').forEach(body=>{
      [...body.querySelectorAll(':scope>.lp-layer:not(.lp-child)')].forEach(el=>{
        const found=findLayer(el.dataset.layer);
        if(!found||!found.layer.leaflet) return;
        if(found.layer.visible) found.layer.leaflet.bringToFront();
      });
    });
  }
}

// ── Panel collapse toggle ─────────────────────────────────────────────────────
document.getElementById('lpCollapseBtn').addEventListener('click', () => {
  const panel=document.getElementById('layersPanel');
  const collapsed=panel.classList.toggle('collapsed');
  document.getElementById('lpCollapseBtn').textContent = collapsed ? '›' : '‹';

// THEME / TILES / MISC
// ══════════════════════════════════════════════════════════════════════════════
let activeTile=TILES[initialTheme];
function swapTiles(theme) { map.removeLayer(activeTile); activeTile=TILES[theme]; activeTile.addTo(map); }

function toggleTheme() {
  const html=document.documentElement;
  const next=html.getAttribute('data-theme')==='dark'?'light':'dark';
  html.setAttribute('data-theme',next);
  localStorage.setItem('imali-theme',next);
  document.querySelector('.theme-toggle').textContent=next==='dark'?'☀ Light':'☾ Dark';
  swapTiles(next); applyBorderStyle(next);
}

const coordPill=document.getElementById('coordPill');
map.on('mousemove', e => {
  // Coordinate pill
  coordPill.textContent = `${e.latlng.lat.toFixed(5)}°, ${e.latlng.lng.toFixed(5)}°`;
  // Identify debounce — fire 200ms after cursor stops moving
  clearTimeout(_idTimer);
  const cx = e.originalEvent.clientX, cy = e.originalEvent.clientY;
  _idTimer = setTimeout(() => doIdentify(e.latlng, cx, cy), 200);
});
map.on('mouseout', () => {
  coordPill.textContent = 'Hover map for coordinates';
  clearTimeout(_idTimer);
  hideMPTip();
});

const zoomPill=document.getElementById('zoomPill');
map.on('zoomend',()=>zoomPill.textContent=map.getZoom());

document.querySelector('.theme-toggle').textContent=initialTheme==='dark'?'☀ Light':'☾ Dark';

// ══════════════════════════════════════════════════════════════════════════════
// MASTER PLAN HOVER IDENTIFY
// ══════════════════════════════════════════════════════════════════════════════

function getActiveMPLayerIds() {
  const ids = [];
  for (const [bid, arcIds] of Object.entries(MP_LAYERS_MAP)) {
    const f = findLayer(bid);
    if (f && f.layer.visible) ids.push(...arcIds);
  }
  return ids;
}

function hideMPTip() {
  document.getElementById('mpIdTip').style.display = 'none';
}

let _idTimer  = null;
let _idAbort  = null;

async function doIdentify(latlng, clientX, clientY) {
  // Build the list of active identify targets
  const queries = [];

  // 1 · Kigali City master plan layers
  const arcIds = getActiveMPLayerIds();
  if (arcIds.length) queries.push({ url: MP_URL, layers: `all:${arcIds.join(',')}`, isMP: true });

  // 2 · Active district DLUP MapServer layers
  for (const [lid, url] of Object.entries(DLUP_IDENTIFY)) {
    const f = findLayer(lid);
    if (f && f.layer.visible) queries.push({ url, layers: 'all', isMP: false });
  }

  if (!queries.length) { hideMPTip(); return; }

  // Cancel any in-flight requests
  if (_idAbort) { try { _idAbort.abort(); } catch(e) {} }
  _idAbort = new AbortController();
  const sig = _idAbort.signal;

  const bounds = map.getBounds();
  const size   = map.getSize();
  const baseP  = {
    geometry:       `${latlng.lng},${latlng.lat}`,
    geometryType:   'esriGeometryPoint',
    sr:             '4326',
    tolerance:      '3',
    mapExtent:      `${bounds.getWest()},${bounds.getSouth()},${bounds.getEast()},${bounds.getNorth()}`,
    imageDisplay:   `${size.x},${size.y},96`,
    returnGeometry: 'false',
    f:              'json',
  };

  try {
    // Fire identify + legend requests in parallel across all active targets
    const buckets = await Promise.all(queries.map(async q => {
      const [legend, raw] = await Promise.all([
        q.isMP ? getMPLegend() : getDLUPLegend(q.url),
        fetch(`${q.url}/identify?${new URLSearchParams({ ...baseP, layers: q.layers })}`, { signal: sig })
          .then(r => r.ok ? r.json() : { results: [] })
          .catch(() => ({ results: [] })),
      ]);
      return (raw.results || [])
        .filter(res => res.value && res.value.trim() !== '' && res.value !== 'N/A' && res.value !== 'Null')
        .map(res => ({ ...res, _legend: legend }));  // annotate with the right legend
    }));

    const all = buckets.flat();
    if (!all.length) { hideMPTip(); return; }
    renderMPTip(clientX, clientY, all);
  } catch(e) {
    if (e.name !== 'AbortError') hideMPTip();
  }
}

function renderMPTip(clientX, clientY, results) {
  let html = '';

  for (const res of results) {
    // Each result carries its own legend cache (_legend), set by doIdentify
    const lyrLegend = (res._legend || _mpLegend || {})[res.layerId];
    const rawVal    = (res.value || '').trim();
    const layerNm   = res.layerName || '';

    // Best-effort match: rawVal against legend labels
    let matched = null;
    if (lyrLegend?.items?.length) {
      const v = rawVal.toUpperCase();
      matched = lyrLegend.items.find(it => {
        if (!it.label) return false;
        const l = it.label.toUpperCase();
        return (
          l === v ||
          l.startsWith(v + ' ') || l.startsWith(v + '-') || l.startsWith(v + ',') ||
          v.startsWith(l + ' ') || v.startsWith(l + '-') ||
          l.includes(' ' + v)   || l.includes('-' + v)
        );
      });
      // Looser fallback: label contains value or value contains label
      if (!matched) {
        matched = lyrLegend.items.find(it => {
          const l = it.label?.toUpperCase() || '';
          return l.includes(v) || v.includes(l);
        });
      }
    }

    html += `<div class="mp-id-entry">`;
    html += `<div class="mp-id-lyr">${layerNm}</div>`;
    html += `<div class="mp-id-row">`;
    if (matched?.imageData) {
      const ct = matched.contentType || 'image/png';
      html += `<img class="mp-id-swatch" src="data:${ct};base64,${matched.imageData}" alt="">`;
    }
    const displayLabel = matched?.label || rawVal;
    html += `<span class="mp-id-val">${displayLabel}</span>`;
    html += `</div>`;
    // Show raw attribute code if it differs from the matched label (e.g. show "R1" under "R1 — Low Density Residential")
    if (matched && matched.label && matched.label !== rawVal) {
      html += `<div class="mp-id-raw">${rawVal}</div>`;
    }
    html += `</div>`;
  }

  const tip   = document.getElementById('mpIdTip');
  const inner = document.getElementById('mpIdTipInner');
  inner.innerHTML = html;
  tip.style.display = 'block';

  // Position near cursor — flip left/up when near viewport edges
  const W = window.innerWidth, H = window.innerHeight;
  tip.style.left = '-9999px'; // measure before placing
  tip.style.top  = '-9999px';
  const tw = tip.offsetWidth  || 230;
  const th = tip.offsetHeight || 80;
  const ox = 16, oy = -10;
  let left = clientX + ox;
  let top  = clientY + oy;
  if (left + tw > W - 10) left = clientX - tw - ox;
  if (top  + th > H - 10) top  = clientY - th - 4;
  tip.style.left = `${Math.max(6, left)}px`;
  tip.style.top  = `${Math.max(6, top)}px`;
}

// ── Boot ──────────────────────────────────────────────────────────────────────
renderPanel();
updateActiveCounts();

});
